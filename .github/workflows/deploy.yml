name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # prebuild regenerates the data from the public APIs; the token raises the GitHub rate limits.
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload only, one file at a time with curl over FTPS: files already on Aruba (e.g. /v3/) are
      # never deleted. lftp cut some files at 16 KB on this server. HTML goes last, so a page never
      # points to a bundle not uploaded yet. The FTP root holds only the www.sndesign.it folder.
      # ftplnx02.aruba.it is the server behind ftp.sndesign.it and the name on its TLS certificate.
      - name: Upload to Aruba
        working-directory: dist/portfolio/browser
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          { find . -type f ! -name '*.html' -printf '%P\n'; find . -type f -name '*.html' -printf '%P\n'; } |
            while read -r file; do
              echo "$file"
              curl -sS --fail --ssl-reqd --ftp-create-dirs --retry 3 --user "$FTP_USERNAME:$FTP_PASSWORD" \
                -T "$file" "ftp://ftplnx02.aruba.it/www.sndesign.it/$file"
            done

      - name: Check the live pages match the build
        working-directory: dist/portfolio/browser
        run: |
          curl -sS --fail https://www.sndesign.it/ | cmp - index.html
          curl -sS --fail https://www.sndesign.it/en/ | cmp - en/index.html
