name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # prebuild regenerates the data from the public APIs; the token raises the GitHub rate limits.
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload only: mirror without --delete never removes files already on Aruba (e.g. /v3/).
      # ftplnx02.aruba.it is the server behind ftp.sndesign.it and the name on its TLS certificate.
      - name: Upload to Aruba
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -c "set ftp:ssl-force true; set ftp:ssl-protect-data true; \
            open --user \"$FTP_USERNAME\" --env-password ftp://ftplnx02.aruba.it; \
            mirror --reverse --no-perms --parallel=4 --verbose dist/portfolio/browser/ /"
